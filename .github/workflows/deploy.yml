# Deploy scannerfinder.com: every push to main builds the site and uploads it to Cloudflare Pages.
# This is the only way to production (2026-10-15): no deploys from a laptop.
# Secrets (repo Settings -> Secrets and variables -> Actions): CLOUDFLARE_API_TOKEN (Pages: Edit only), CLOUDFLARE_ACCOUNT_ID.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/directory-blueprint/output/scannerfinder/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/directory-blueprint/output/scannerfinder/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name scannerfinder --branch main --commit-hash ${{ github.sha }} --commit-message "${{ github.event.head_commit.message || 'manual deploy' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
