<!DOCTYPE html>
<!--
  SEO Content Engine — article preview shell.

  Stage 8 fills these placeholders:
    {{TITLE}}        - the article H1 text (plain text, for <title> + header)
    {{ARTICLE_HTML}} - the full article body converted from markdown to HTML

  Styling hooks the body HTML should use (wrap content in these):
    <div class="tldr"><span class="summary-label">The Bottom Line</span> ... </div>
      the summary block (right after the intro). Set the label text to match the
      article's tone (e.g. "The Bottom Line" / "Executive Summary" for professional,
      "In Brief" / "Quick Summary" for modern business, "TL;DR" for tech/startup).
      The markdown article keeps NO label — this label is preview-only.
    <aside class="product-callout"> ... </aside> a product cross-promo
      inside it: <h4>, <p>, and <a class="cta" href="..."> for the button

  The <h1> is rendered by the template header, so the body HTML should start at
  the TL;DR / first H2 (don't repeat the H1 inside {{ARTICLE_HTML}}).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --ink: #16181d;
    --muted: #5b626e;
    --line: #e5e7eb;
    --bg: #ffffff;
    --accent: #1f6feb;          /* restrained blue, deliberately not the usual clay tell */
    --accent-soft: #eef4ff;
    --callout-bg: #f7f8fa;
    --measure: 68ch;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Source Serif Pro", serif;
    font-size: 19px;
    line-height: 1.65;
  }
  .wrap { max-width: var(--measure); margin: 0 auto; padding: 4rem 1.25rem 6rem; }

  header.article-head { margin-bottom: 2rem; }
  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin: 0 0 0.75rem;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.1; letter-spacing: -0.02em; margin: 0;
    font-weight: 700;
  }

  h2, h3, h4 {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.25; letter-spacing: -0.01em; color: var(--ink);
  }
  h2 { font-size: 1.6rem; margin: 3rem 0 1rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
  h3 { font-size: 1.2rem; margin: 2rem 0 0.75rem; }
  p { margin: 0 0 1.25rem; }
  a { color: var(--accent); text-underline-offset: 2px; }

  /* Summary block — visually distinct. The label is set per-article (see the
     .summary-label span below), not hardcoded. */
  .tldr {
    background: var(--accent-soft);
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    padding: 1.1rem 1.3rem;
    margin: 0 0 2.5rem;
    font-size: 1.02rem;
    font-style: italic;
    color: #1c2430;
  }
  .tldr .summary-label {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-style: normal; font-weight: 700; font-size: 0.7rem;
    letter-spacing: 0.12em; color: var(--accent); margin-bottom: 0.4rem;
    text-transform: uppercase;
  }

  /* Product callout — clearly a cross-promo, not body copy */
  .product-callout {
    background: var(--callout-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.25rem 1.4rem;
    margin: 2rem 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
    line-height: 1.55;
  }
  .product-callout h4 {
    margin: 0 0 0.4rem; font-size: 1.05rem;
  }
  .product-callout p { margin: 0 0 1rem; color: var(--muted); }
  .cta {
    display: inline-block;
    background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 600; font-size: 0.9rem;
    padding: 0.6rem 1.1rem; border-radius: 6px;
  }
  .cta:hover { filter: brightness(1.08); }

  table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--line); }
  th { background: var(--callout-bg); font-weight: 700; }

  blockquote { margin: 1.5rem 0; padding-left: 1.1rem; border-left: 3px solid var(--line); color: var(--muted); font-style: italic; }
  ul, ol { margin: 0 0 1.25rem; padding-left: 1.4rem; }
  li { margin-bottom: 0.4rem; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--callout-bg); padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85em; }

  @media (max-width: 620px) {
    body { font-size: 18px; }
    .wrap { padding: 2.5rem 1.1rem 4rem; }
    h2 { font-size: 1.4rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="article-head">
      <p class="eyebrow">Guide</p>
      <h1>{{TITLE}}</h1>
    </header>
    <article>
      {{ARTICLE_HTML}}
    </article>
  </div>
</body>
</html>
